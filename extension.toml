id = "terra_rpmspec"  # change id to rpmspec before contributing to zed registry
name = "RPM Spec"
version = "0.0.1"
schema_version = 1
authors = ["Its-J <jonah@fyralabs.com>"]
description = "RedHat Package Manager .spec file support"
repository = "https://github.com/Its-J/rpmspec-zed"

[grammars.rpmspec]
# fork with grammar fixes (main branch), upstream is
# https://gitlab.com/cryptomilk/tree-sitter-rpmspec at 7d1557162655f677729dca90cc180aca657053ec
repository = "https://gitlab.com/J-GitHubAcc/tree-sitter-rpmspec"
commit = "457937f097f59417b331d3f9de0cf4249660d688"
path = "rpmspec"

[grammars.rpmbash]
# same fork and commit, rpmbash itself is unchanged from upstream
repository = "https://gitlab.com/J-GitHubAcc/tree-sitter-rpmspec"
commit = "457937f097f59417b331d3f9de0cf4249660d688"
path = "rpmbash"

# rpm-spec-language-server, has to be installed separately (rpm_lsp_server on PATH)
[language_servers.rpmspec]
name = "RPM Spec Language Server"
language = "RPM Spec"
